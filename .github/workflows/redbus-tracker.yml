name: bus-trackers

on:
  schedule:
    # GitHub cron is in UTC. IST = UTC+5:30
    - cron: "30 3 * * *"   # 09:00 IST daily
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write           # needed to commit the CSVs back to the repo

concurrency:
  group: bus-trackers       # never run two at once (avoids push conflicts)
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright openpyxl
          playwright install --with-deps chromium

      - name: Run redBus tracker
        run: xvfb-run -a python redbus_tracker.py --days-ahead 1 --headed

      - name: Run AbhiBus tracker
        if: always()        # still runs if the previous tracker failed
        run: xvfb-run -a python abhibus_tracker.py --days-ahead 1 --headed

      - name: Run Paytm tracker
        if: always()
        run: xvfb-run -a python paytm_tracker.py --days-ahead 1 --headed

      - name: Commit results
        if: always()
        run: |
          git config user.name "bus-bot"
          git config user.email "bus-bot@users.noreply.github.com"
          git add freshbus_*.csv
          git diff --cached --quiet || git commit -m "tracker run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

      - name: Upload debug files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
