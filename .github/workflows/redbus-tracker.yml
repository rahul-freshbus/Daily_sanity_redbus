name: redbus-tracker

on:
  schedule:
    # GitHub cron is in UTC. IST = UTC+5:30
    - cron: "30 3 * * *"   # 09:00 IST
    - cron: "30 9 * * *"   # 15:00 IST
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # needed to commit the CSVs back to the repo

concurrency:
  group: redbus-tracker     # never run two at once (avoids push conflicts)
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright openpyxl
          playwright install --with-deps chromium

      - name: Run tracker
        run: xvfb-run -a python redbus_tracker.py --days-ahead 1 --headed

      - name: Commit results
        run: |
          git config user.name "redbus-bot"
          git config user.email "redbus-bot@users.noreply.github.com"
          git add freshbus_redbus_*.csv
          git diff --cached --quiet || git commit -m "tracker run $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

      - name: Upload debug files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
